{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – RFU10 LMS</title>
  <link rel="icon" type="image/png" href="{% static 'img/RFU10 Logo.png' %}">
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/login.css' %}"/>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-container">

      <div class="welcome-panel">
        <img src="{% static 'img/RFU10 Logo.png' %}" class="small-logo" alt="RFU10 Logo"/>
        <h1>Account<br/>Recovery</h1>
        <p class="panel-sub">Enter your details to regain access.</p>
      </div>

      <div class="form-panel">
        <h2>Forgot Password?</h2>
        <p class="subtitle">We'll email you a link to reset your password.</p>

        <form method="POST">
          {% csrf_token %}

          <div class="input-group">
            <label for="id_email">Email Address</label>
            <input type="email" name="email" id="id_email"
                   placeholder="example@pnp.gov.ph" required autocomplete="email"/>
          </div>

          <button type="submit" class="login-button">Send Reset Link</button>

          <div class="form-footer">
            <a href="{% url 'login' %}">← Back to Login</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</body>
</html>
