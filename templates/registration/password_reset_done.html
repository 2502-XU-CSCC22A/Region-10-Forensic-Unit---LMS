{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Sent – RFU10 LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/login.css' %}"/>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-container">

      <div class="welcome-panel">
        <img src="{% static 'img/RFU10 Logo.png' %}" class="small-logo" alt="RFU10 Logo"/>
        <h1>Check your<br/>Inbox</h1>
        <p class="panel-sub">Recovery instructions sent.</p>
      </div>

      <div class="form-panel">
        <h2>Email Sent!</h2>
        <p class="subtitle">
          If an account exists with that email address, you'll receive a
          password-reset link shortly.<br/><br/>
          Don't forget to check your spam folder.
        </p>

        <a href="{% url 'login' %}" class="login-button" style="margin-top: 32px;">
          Return to Login
        </a>
      </div>

    </div>
  </div>
</body>
</html>
