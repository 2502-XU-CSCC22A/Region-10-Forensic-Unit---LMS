{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Changed – RFU10 LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/login.css' %}"/>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-container">

      <div class="welcome-panel success-panel">
        <img src="{% static 'img/RFU10_Logo.png' %}" class="small-logo" alt="RFU10 Logo"/>
        <h1>All Set!</h1>
        <p class="panel-sub">Your security is our priority.</p>
      </div>

      <div class="form-panel">
        <h2>Password Changed</h2>
        <p class="subtitle">
          Your password has been successfully updated.<br/><br/>
          You can now use your new credentials to log in.
        </p>

        <a href="{% url 'login' %}" class="login-button" style="margin-top: 32px;">
          Log In Now
        </a>
      </div>

    </div>
  </div>
</body>
</html>
