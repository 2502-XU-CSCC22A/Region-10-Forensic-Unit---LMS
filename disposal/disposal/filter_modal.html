{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;700&display=swap" rel="stylesheet" />

<div id="filterModal" class="filter-modal-overlay">
    <div class="filter-modal-content">
        <div class="filter-modal-header">
            <h2>Filter</h2>
            <button class="filter-close-btn" type="button" onclick="closeFilterModal()">&times;</button>
        </div>

        <form method="GET" action="{% url 'disposal:disposal_list' %}">
            <div class="filter-modal-body">

                <div class="filter-section">
                    <h1>Type</h1>
                    <div class="tag-container">
                        <div class="filter-item">
                            <input type="radio" name="device_type" value="firearms" id="firearm">
                            <label for="firearm" class="filter-tag">Firearms</label>
                        </div>
                
                        <div class="filter-item">
                            <input type="radio" name="device_type" value="mobility" id="mobility" >
                            <label for="mobility" class="filter-tag">Mobility</label>
                        </div>
                
                        <div class="filter-item">
                            <input type="radio" name="device_type" value="communications" id="comm_dev" >
                            <label for="comm_dev" class="filter-tag">Communication Device</label>
                        </div>
                
                        <div class="filter-item">
                            <input type="radio" name="device_type" value="investigative_equipment" id="inv_equipment" >
                            <label for="inv_equipment" class="filter-tag">Investigative Equipment</label>
                        </div>
                    </div>
                </div>

                <div class="filter-section">
                    <h1>Expiry Status</h1>
                    <div class="tag-container">
                        <div class="filter-item">
                            <input type="radio" name="expiry_status" value="Expired" id="expired" >
                            <label for="expired" class="filter-tag">Expired</label>
                        </div>
                        <div class="filter-item">
                            <input type="radio" name="expiry_status" value="expired_3Months" id="expired_3Months" >
                            <label for="expired" class="filter-tag">Expired (3 Months)</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-modal-footer">
                <button type="submit" class="filter-btn-apply">Apply Filter</button>
                
                <button type="button" class="filter-btn-reset" onclick="resetFilters()">Reset</button>
            </div>
            
            <script>
                function resetFilters() {
                    // 1. Clear all radio buttons
                    const radios = document.querySelectorAll('#filterModal input[type="radio"]');
                    radios.forEach(radio => radio.checked = false);
                    
                    // 2. Redirect to the base page without parameters
                    window.location.href = "{% url 'disposal:disposal_list' %}";
                }
            </script>
            
            <style>
                /* Styling for the Reset button so it doesn't look like the Apply button */
                .filter-btn-reset {
                    background-color: #f1f5f9;
                    color: #64748b;
                    border: 1px solid #e2e8f0;
                    padding: 10px 20px;
                    border-radius: 8px;
                    cursor: pointer;
                    font-weight: 500;
                    transition: 0.2s;
                }
                .filter-btn-reset:hover {
                    background-color: #e2e8f0;
                }
            </style>
        </form>
    </div>
</div>
