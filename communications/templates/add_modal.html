{% load static %}

<div id="addEquipmentModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add New Equipment</h2>
            <button class="close-btn" type="button" onclick="toggleAddModal()">&times;</button>
        </div>

        <form method="POST" action="{% url 'add_communication' %}">
            {% csrf_token %}
            <div class="modal-body">

                <div class="filter-section">
                    <label for="id_type">Communication Type</label>
                    <input type="text" name="type" id="id_type" class="form-input" placeholder="e.g. Analog Repeater" required>
                </div>

                <div class="filter-section">
                    <label for="id_imei">IMEI / Serial Number</label>
                    <input type="text" name="imei_serial" id="id_imei" class="form-input" placeholder="e.g. SN-123456789">
                </div>

                <div class="filter-section">
                    <label for="id_frequency">Frequency Range</label>
                    <input type="text" name="frequency_range" id="id_frequency" class="form-input" placeholder="e.g. 136-174 MHz" required>
                </div>

                <div class="filter-section">
                    <label for="id_stock">Stock Level</label>
                    <input type="number" name="stock_level" id="id_stock" class="form-input" value="0" min="0" required>
                </div>

            </div>

            <div class="modal-footer">
                <button type="submit" class="btn-apply">Save Equipment</button>
                <button type="button" class="btn-apply btn-cancel" onclick="toggleAddModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>
