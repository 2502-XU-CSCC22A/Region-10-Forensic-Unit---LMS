<header class="navbar-header d-flex align-items-center justify-content-between px-4">
    <div class="header-brand d-flex align-items-center">
        <div class="header-logo">
            PNP<br />FORENSIC<br />GROUP
        </div>

        <div class="header-divider"></div>

        <h1 class="header-title">
            Regional Forensic Unit 10 LMS
        </h1>
    </div>

    <div class="header-user d-flex align-items-center">
        <div class="profile-group d-flex align-items-center">

            <div class="user-avatar d-flex align-items-center justify-content-center">
                <i class="fas fa-user text-muted"></i>
            </div>

            <div class="user-text ml-2">
                <div class="user-name font-weight-bold">
                    {{ user.get_full_name|default:user.username }}
                </div>

                <div class="user-role text-muted">
                    Logistics Officer
                </div>
            </div>

        </div>
    </div>
</header>
