{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Logs</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">

  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    .page-title {
      font-weight: 700;
      color: #1a2b6d;
      margin: 20px 0 4px 0;
      font-size: 28px;
    }

    .filter-btn {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 15px;
      border-radius: 20px;
    }

    .activity-timeline {
      font-family: 'Inter', sans-serif;
      width: 100%;
      margin: 0;
    }

    .log-card-delete,
    .log-card-update,
    .log-card-create,
    .log-card-moved {
      border-left: 4px solid #ef4444 !important;
      border-radius: 3px !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .12) !important;
      margin-bottom: 16px !important;
      background: #ffffff;
    }

    .log-card-delete .card-body,
    .log-card-update .card-body,
    .log-card-create .card-body,
    .log-card-moved .card-body {
      padding: 22px 34px !important;
    }

    .asset-id-badge {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: bold;
      font-size: 12px;
    }

    .badge-secondary {
      background-color: #6b7280 !important;
      color: white;
      font-size: 11px;
    }

    .action-label {
      font-size: 12px;
      font-weight: 800;
      color: #0f172a;
      text-transform: uppercase;
      margin-left: 10px;
    }

    .log-title {
      font-size: 16px;
      font-weight: 800;
      color: #000;
      margin-bottom: 6px;
    }

    .log-stock {
      font-size: 13px;
      color: #475569;
      margin-bottom: 8px;
    }

    .log-time {
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
    }

    .return-link {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #64748b;
      font-weight: 600;
      text-decoration: none;
    }

    .return-link:hover {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  {% include 'header.html' %}
  <div class="layout"></div>
  {% include 'sidebar.html' %}

  <main>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="page-title mb-0">Activity History</h3>
        <p class="text-muted small">
          Tracking Communications modifications, additions, and updates
        </p>
      </div>

      <div class="btn-group">
        <button id="btnLast7" class="btn filter-btn btn-primary">
          Last 7 Days
        </button>

        <button id="btnLast30" class="btn filter-btn btn-outline-primary">
          Last 30 Days
        </button>
      </div>
    </div>

    <div class="activity-timeline" id="activityLogList">
      <div class="text-center py-5">
        <i class="fas fa-history fa-3x text-light mb-3"></i>
        <p class="text-muted">Loading activity logs...</p>
      </div>
    </div>

    <a href="{% url 'communications_list' %}" class="return-link">
      <i class="fas fa-arrow-left mr-1"></i> Return to Communications
    </a>
  </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script>
    const sb = window.supabase.createClient(
      "https://vamjajitzyspdyfxisac.supabase.co",
      "sb_publishable_mTj-PK3WV3ZPqGOii548Ng_EXvssL54"
    );

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString();
    }

    function getDateDaysAgo(days) {
      const date = new Date();
      date.setDate(date.getDate() - days);
      return date.toISOString();
    }

    function setActiveButton(days) {
      const btn7 = document.getElementById("btnLast7");
      const btn30 = document.getElementById("btnLast30");

      if (days === 7) {
        btn7.classList.remove("btn-outline-primary");
        btn7.classList.add("btn-primary");

        btn30.classList.remove("btn-primary");
        btn30.classList.add("btn-outline-primary");
      } else {
        btn30.classList.remove("btn-outline-primary");
        btn30.classList.add("btn-primary");

        btn7.classList.remove("btn-primary");
        btn7.classList.add("btn-outline-primary");
      }
    }

    function getActionIcon(action) {
      if (!action) return "fa-history";

      const lower = action.toLowerCase();

      if (lower.includes("delete")) return "fa-trash-alt";
      if (lower.includes("create")) return "fa-plus-circle";
      if (lower.includes("update")) return "fa-edit";
      if (lower.includes("move")) return "fa-undo";

      return "fa-history";
    }

    async function loadActivityLogs(days = 7) {
      setActiveButton(days);

      const list = document.getElementById("activityLogList");

      list.innerHTML = `
        <div class="text-center py-5">
          <i class="fas fa-history fa-3x text-light mb-3"></i>
          <p class="text-muted">Loading activity logs...</p>
        </div>
      `;

      const startDate = getDateDaysAgo(days);

      const { data, error } = await sb
        .from("communications_activitylog")
        .select("*")
        .gte("created_at", startDate)
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);

        list.innerHTML = `
          <div class="text-center py-5">
            <i class="fas fa-exclamation-circle fa-3x text-danger mb-3"></i>
            <p class="text-muted">Failed to load activity logs.</p>
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = `
          <div class="text-center py-5">
            <i class="fas fa-history fa-3x text-light mb-3"></i>
            <p class="text-muted">
              No activity logs found in the last ${days} days.
            </p>
          </div>
        `;

        return;
      }

      list.innerHTML = data.map(log => `
        <div class="card shadow-sm log-card-delete">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">

              <div>
                <div class="d-flex align-items-center mb-2">
                  <span class="badge asset-id-badge mr-2">
                    ID: ${log.communication_id ?? "-"}
                  </span>

                  <span class="badge badge-pill badge-secondary">
                    communications
                  </span>

                  <span class="action-label">
                    <i class="fas ${getActionIcon(log.action)} mr-1"></i>
                    ${log.action || "Activity"}
                  </span>
                </div>

                <div class="log-title">
                  ${log.action || "Activity Recorded"}
                </div>

                <p class="log-stock">
                  ${log.details || "No details available"}
                </p>

                <small class="text-muted">
                  Action by: System Administrator
                </small>
              </div>

              <div class="text-right">
                <span class="log-time text-nowrap">
                  <i class="far fa-clock"></i> ${formatDate(log.created_at)}
                </span>
              </div>

            </div>
          </div>
        </div>
      `).join("");
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("btnLast7").addEventListener("click", () => {
        loadActivityLogs(7);
      });

      document.getElementById("btnLast30").addEventListener("click", () => {
        loadActivityLogs(30);
      });

      loadActivityLogs(7);
    });
  </script>

</body>

</html>
