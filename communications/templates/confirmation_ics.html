{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;700&display=swap" rel="stylesheet" />

<style>
    h1 {
        font-family: 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #1a237e;
    }

    p {
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        color: #1a237e;
    }

    .filter-section h1 {
        font-family: 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #1a237e;
    }

    /* MODAL BACKGROUND */
    #confirmationModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        justify-content: center;
        align-items: center;
    }

    #confirmationModal.active {
        display: flex;
    }

    /* MODAL CARD */
    .filter-modal-content {
        background: white;
        width: 600px;
        max-height: 90vh;
        border-radius: 28px;
        padding: 32px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        overflow-y: auto;
        border: 1px solid rgba(0, 0, 0, 0.05);
    }

    /* HEADER */
    .filter-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eee;
        padding-bottom: 15px;
        margin-bottom: 25px;
    }

    .filter-modal-header h2 {
        font-family: 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #1a237e;
    }

    /* CLOSE BUTTON */
    .filter-close-btn {
        font-size: 28px;
        background: none;
        border: none;
        cursor: pointer;
        color: #666;
        transition: 0.2s ease;
    }

    .filter-close-btn:hover {
        color: #dc3545;
    }

    /* BODY */
    .filter-section {
        margin-bottom: 24px;
    }

    .filter-section label {
        display: block;
        font-weight: 500;
        font-size: 14px;
        color: #333;
        margin-bottom: 12px;
    }

    /* FOOTER */
    .filter-modal-footer {
        display: flex;
        flex-direction: row;
        gap: 25px;
    }

    /* BUTTON BASE */
    .filter-btn-apply,
    .filter-btn-reset {
        font-family: 'Inter', sans-serif;
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        margin-top: 20px;
        background: white;
        border: 2px solid;
        transition: 0.2s ease;
    }

    /* DELETE BUTTON */
    .filter-btn-apply {
        border-color: #de0e22;
        color: #dc3545;
    }

    .filter-btn-apply:hover {
        background: #dc3545;
        color: #FFFFFF;
    }

    /* CANCEL BUTTON */
    .filter-btn-reset {
        border-color: #3C59DD;
        color: #1a237e;
    }

    .filter-btn-reset:hover {
        background: #151b61;
        color: #FFFFFF;
    }
</style>

<div id="confirmationModal" class="filter-modal-overlay">

    <div class="filter-modal-content">

        <div class="filter-modal-header">
            <h2>Removal of ICS Record</h2>

            <button class="filter-close-btn" type="button" onclick="closeConfirmationModal()">
                &times;
            </button>
        </div>

        <form id="confirmRemovalForm" method="POST">
            {% csrf_token %}

            <div class="filter-modal-body">
                <div class="filter-section">
                    <p>
                        Are you sure you want to remove this record?
                        This action cannot be undone.
                    </p>
                </div>
            </div>
x
            <div class="filter-modal-footer">

                <button type="submit" class="filter-btn-apply">
                    Confirm Delete
                </button>

                <button type="button" class="filter-btn-reset" onclick="closeConfirmationModal()">
                    Cancel
                </button>

            </div>
        </form>

    </div>

</div>
