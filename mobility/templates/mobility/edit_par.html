{% extends 'base_generic.html' %}

{% block content %}
<div class="container mt-4">
    <h3>Edit Property Acknowledgement Receipt</h3>
    <div class="card shadow-sm p-4">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}  <div class="mt-3">
                <button type="submit" class="btn btn-primary">Update Record</button>
                <a href="{% url 'par_management' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
