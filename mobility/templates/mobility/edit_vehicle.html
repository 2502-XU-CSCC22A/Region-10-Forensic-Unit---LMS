{% extends 'base_generic.html' %}

{% block content %}
<style>
    .section-title { font-weight: 700; color: #1a2b6d; margin: 20px 0 15px 0; }
    .edit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .compact-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
    .compact-group input, .compact-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 0.9rem; }
    
    /* Hover effect for the delete button */
    .btn-outline-danger:hover { background-color: #dc3545; color: white; }
</style>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="section-title mb-0">Update Vehicle Asset</h3>
            <p class="text-muted small">Editing Record: {{ vehicle.plate_number|default:vehicle.conduction_number }}</p>
        </div>
        <a href="{% url 'mobility:vehicle_management' %}" class="btn btn-sm btn-outline-secondary px-4">Cancel</a>
    </div>

    <div class="card shadow-sm p-4 border-0" style="border-radius: 15px;">
        <form method="POST">
            {% csrf_token %}
            <div class="edit-grid">
                {% for field in form %}
                <div class="compact-group mb-3">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
            </div>
            
            <hr class="my-4">
            
            <div class="d-flex justify-content-between align-items-center mt-2">
                <a href="{% url 'mobility:delete_vehicle' vehicle.pk %}" 
                   class="btn btn-outline-danger px-4" 
                   style="border-radius: 8px; font-weight: 600;"
                   onclick="return confirm('Are you sure you want to delete this vehicle asset? This action cannot be undone.');">
                    <i class="fas fa-trash-alt mr-2"></i> Delete Asset
                </a>

                <button type="submit" class="btn btn-primary px-5 shadow-sm" style="background-color: #1a2b6d; border: none; border-radius: 8px; font-weight: 600;">
                    <i class="fas fa-check-circle mr-2"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
