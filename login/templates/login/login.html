{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PNP Forensic Group</title>
    <link rel="icon" type="image/png" href="{% static 'img/RFU10 Logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'login/login.css' %}" />
  </head>

  <body>
    <div class="login-wrapper">
      <div class="login-container">
        <div class="welcome-panel">
          <img src="{% static 'img/RFU10 Logo.png' %}" class="small-logo" alt="Logo" />
          <h1>Welcome Back!</h1>
        </div>

        <div class="form-panel">
          <form method="POST" action="#">
            {% csrf_token %}
            <div class="right-container">
              <div class="header">
                <p>LOGIN</p>
              </div>

              <div class="input-group">
                <label>User Name</label>
                <input type="text" name="username" placeholder="Enter your username" required />
              </div>

              <div class="input-group" style="position: relative;">
                <label>Password</label>
                <input type="password" name="password" id="passwordInput" placeholder="Enter your password" required />
                <span id="togglePassword" style="cursor: pointer; position: absolute; right: 10px; top: 35px;"><i class="ph ph-eye" id="eyeIcon"></i></span>
              </div>

              <div class="form-options">
                <label class="remember-me">
                  <input type="checkbox" name="remember" />
                  <span>Remember Me</span>
                </label>
                <a href="{% url 'password_reset_form' %}" class="forgot-link">Forgot Password?</a>
              </div>

              <button type="submit" class="login-button">Login</button>

              {% if messages %}
                {% for message in messages %}
                  <p class="error-msg">{{ message }}</p>
                {% endfor %}
              {% endif %}
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>

  <script>
    const togglePassword = document.querySelector('#togglePassword')
    const password = document.querySelector('#passwordInput')
    const eyeIcon = document.querySelector('#eyeIcon')
    
    togglePassword.addEventListener('click', function (e) {
      // Toggle the type attribute
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password'
      password.setAttribute('type', type)
    
      // Toggle the icon (if using Phosphor icons like in your previous code)
      if (type === 'text') {
        eyeIcon.classList.replace('ph-eye', 'ph-eye-slash')
      } else {
        eyeIcon.classList.replace('ph-eye-slash', 'ph-eye')
      }
    })
  </script>
</html>
