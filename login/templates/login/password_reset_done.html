{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PNP Forensic Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
<div class="login-wrapper">
    <div class="login-container">
        <div class="welcome-panel">
            <img src="{% static 'img/RFU10Logo.png' %}" class="small-logo" alt="Logo" />
            <h1>Check your inbox</h1>
            <p>We've sent recovery instructions to your email.</p>
        </div>

        <div class="form-panel">
            <h2>Email Sent!</h2>
            <p class="subtitle">If an account exists with that email, you'll receive a link shortly. Remember to check your spam folder.</p>
            
            <a href="{% url 'login/' %}" class="login-button" style="text-align: center; text-decoration: none; display: block;">
                Return to Login
            </a>
        </div>
    </div>
</div>
</body>
</html>
